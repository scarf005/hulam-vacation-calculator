name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 태그(vX.Y.Z) push 시에만: 릴리스에 유저스크립트 + 확장 zip 첨부
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.user.js
            dist/*-extension.zip

  # 태그 push 시에만: 크롬 웹스토어 자동 게시 (시크릿 설정 시)
  publish-webstore:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build
      - name: Check Chrome Web Store secrets
        id: check
        run: |
          if [ -n "${{ secrets.CWS_CLIENT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CWS 시크릿 미설정 — 웹스토어 게시를 건너뜁니다. (릴리스 zip은 정상 생성됨)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Chrome Web Store
        if: steps.check.outputs.ready == 'true'
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: dist/hulam-vacation-calculator-extension.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
